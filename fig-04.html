<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIG. 04 — Diezmos y Ofrendas</title>
    <style>
        :root {
            --bg-color: #fcfbf9;
            --text-main: #1a1a1a;
            --text-muted: #666;
            --border-color: #d1d1d1;
            --input-border: #eee;
            --accent-success: #2ecc71;
            --font-serif: 'Georgia', 'Times New Roman', serif;
            --font-sans: 'Helvetica Neue', 'Arial', sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: var(--font-sans); line-height: 1.6; }
        h1, h2 { font-family: var(--font-serif); font-weight: normal; }
        .mono { font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: -0.5px; text-transform: uppercase; color: var(--text-muted); }

        /* Header */
        header { position: fixed; top: 0; left: 0; width: 100%; padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid transparent; background: rgba(252, 251, 249, 0.95); backdrop-filter: blur(5px); z-index: 1000; }
        header.scrolled { border-bottom: 1px solid var(--border-color); }
        .brand-logo { height: 45px; width: auto; display: block; filter: grayscale(100%); opacity: 0.8; }
        nav a { text-decoration: none; color: var(--text-main); font-family: var(--font-mono); font-size: 0.8rem; text-transform: uppercase; margin-left: 2rem; }

        /* Container */
        .container { max-width: 800px; margin: 140px auto 60px; padding: 0 2rem; animation: fadeIn 1s ease-out; }

        /* Header del Formulario */
        .form-header { margin-bottom: 3rem; border-bottom: 1px solid var(--border-color); padding-bottom: 2rem; }
        .form-tag { display: inline-block; margin-bottom: 1rem; border-left: 2px solid var(--text-main); padding-left: 1rem; }
        .form-title { font-size: clamp(2rem, 4vw, 3rem); line-height: 1.1; margin-bottom: 1rem; letter-spacing: -1px; }
        .form-desc { font-family: var(--font-serif); font-size: 1.1rem; color: var(--text-muted); max-width: 500px; }

        /* Formulario */
        .form-group { margin-bottom: 2.5rem; }
        label { display: block; font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem; letter-spacing: 1px; }
        input, select { width: 100%; padding: 0.8rem 0; background: transparent; border: none; border-bottom: 1px solid var(--input-border); font-family: var(--font-serif); font-size: 1.1rem; color: var(--text-main); transition: all 0.3s; }
        input:focus, select:focus { outline: none; border-bottom: 1px solid var(--text-main); padding-left: 5px; }
        
        /* Grid Financiero */
        .finance-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed var(--input-border); }
        
        /* Total Display */
        .total-display { margin-top: 2rem; padding: 1.5rem; background-color: #f4f4f4; border-left: 4px solid var(--text-main); text-align: right; }
        .total-label { font-family: var(--font-mono); font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 0.5rem; }
        .total-amount { font-family: var(--font-serif); font-size: 2rem; color: var(--text-main); font-weight: bold; }

        button { width: 100%; padding: 1.2rem; background-color: var(--text-main); color: #fff; border: none; font-family: var(--font-mono); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; margin-top: 2rem; transition: transform 0.2s; }
        button:hover { transform: translateY(-2px); background-color: #333; }

        .success-message { margin-top: 2rem; padding: 1.5rem; border: 1px solid var(--accent-success); color: var(--accent-success); text-align: center; font-family: var(--font-mono); text-transform: uppercase; display: none; }

        .page-footer { margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--border-color); text-align: center; font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { header { flex-direction: column; gap: 1rem; align-items: flex-start; padding: 1rem; } nav a { margin-left: 0; margin-right: 1.5rem; } .finance-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="brand"><img src="logo.png" alt="Taber" class="brand-logo"></div>
        <nav><a href="index.html">Volver al Hub</a></nav>
    </header>

    <div class="container">
        <div class="form-header">
            <div class="form-tag mono">FIG. 04 — REGISTRO ACTIVO</div>
            <h1 class="form-title">Diezmos y Ofrendas</h1>
            <p class="form-desc">
                Reporte financiero de cierre de culto. Registro seguro de efectivo y ofrendas específicas.
            </p>
        </div>

        <form id="financeForm">
            <div class="form-group">
                <label for="fecha">01 / Fecha</label>
                <input type="date" id="fecha" name="fecha" required>
            </div>

            <div class="form-group">
                <label for="culto">02 / Tipo de Culto</label>
                <select id="culto" name="culto" required>
                    <option value="" disabled selected>Seleccione...</option>
                    <option value="Dominical Mañana">Dominical Mañana</option>
                    <option value="Dominical Noche">Dominical Noche</option>
                    <option value="Miércoles">Miércoles</option>
                    <option value="Viernes">Viernes</option>
                    <option value="Especial">Reunión Especial</option>
                </select>
            </div>

            <!-- Entradas de Dinero -->
            <div class="finance-grid">
                <div class="form-group">
                    <label for="efectivo">03 / Efectivo General ($)</label>
                    <input type="number" step="0.01" id="efectivo" name="efectivo" placeholder="0.00" required oninput="calcularTotal()">
                </div>
                <div class="form-group">
                    <label for="diezmos">04 / Diezmos ($)</label>
                    <input type="number" step="0.01" id="diezmos" name="diezmos" placeholder="0.00" oninput="calcularTotal()">
                </div>
                <div class="form-group">
                    <label for="taber_kids">05 / Ofrenda Taber Kids ($)</label>
                    <input type="number" step="0.01" id="taber_kids" name="taber_kids" placeholder="0.00" required oninput="calcularTotal()">
                </div>
            </div>

            <!-- Total Calculado -->
            <div class="total-display">
                <span class="total-label">Total General Calculado</span>
                <span class="total-amount" id="display_total">$0.00</span>
            </div>

            <div class="form-group" style="margin-top: 2rem;">
                <label for="responsable">06 / Responsable del Conteo</label>
                <input type="text" id="responsable" name="responsable" placeholder="Nombre del tesorero" required>
            </div>

            <div class="form-group">
                <label for="testigo">07 / Testigo</label>
                <input type="text" id="testigo" name="testigo" placeholder="Nombre del testigo" required>
            </div>

            <button type="submit" id="submitBtn">Guardar Reporte</button>
        </form>

        <div id="successMessage" class="success-message">
            ✓ Reporte guardado exitosamente.
        </div>

        <div class="page-footer">
            Taber Digital · Finanzas v1.0 <br>
            Hecho a mano, módulo por módulo · El Salvador 2026
        </div>
    </div>

    <script>
        function calcularTotal() {
            const ef = parseFloat(document.getElementById('efectivo').value) || 0;
            const diez = parseFloat(document.getElementById('diezmos').value) || 0;
            const kids = parseFloat(document.getElementById('taber_kids').value) || 0;
            
            const total = ef + diez + kids;
            
            document.getElementById('display_total').textContent = '$' + total.toFixed(2);
            document.getElementById('display_total').dataset.value = total.toFixed(2);
        }

        const SHEETDB_API_URL = 'https://sheetdb.io/api/v1/5gqgmamuwhfo5'; 

        document.getElementById('financeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const successMsg = document.getElementById('successMessage');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Procesando...';
            calcularTotal();

            const formData = {
                fecha: document.getElementById('fecha').value,
                culto: document.getElementById('culto').value,
                efectivo: document.getElementById('efectivo').value,
                diezmos: document.getElementById('diezmos').value,
                taber_kids: document.getElementById('taber_kids').value,
                total_general: parseFloat(document.getElementById('display_total').dataset.value) || 0,
                responsable: document.getElementById('responsable').value,
                testigo: document.getElementById('testigo').value
            };

            try {
                const response = await fetch(SHEETDB_API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(formData) });
                if (response.ok) {
                    successMsg.style.display = 'block';
                    this.reset();
                    document.getElementById('fecha').valueAsDate = new Date();
                    document.getElementById('display_total').textContent = '$0.00';
                    setTimeout(() => window.location.href = 'index.html', 3000);
                } else { throw new Error('Error'); }
            } catch (error) {
                alert('Error de conexión');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Guardar Reporte';
            }
        });
        document.getElementById('fecha').valueAsDate = new Date();
    </script>
</body>
</html>
